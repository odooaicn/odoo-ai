
#user  nobody;
worker_processes  1;
events {
    worker_connections  2048;
    multi_accept on;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志配置
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr, upstream_status: $upstream_status '
                    'request_time: $request_time, upstream_response_time: $upstream_response_time';

    access_log logs/access.log main;
    error_log logs/error.log info;

    sendfile        on;
    keepalive_timeout  600;
    client_header_timeout   3000s;
    client_body_timeout     3000s;
    send_timeout 3000s;

    gzip  on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types   text/plain text/css text/xml text/javascript application/javascript application/json application/x-javascript application/xml application/rss+xml application/xhtml+xml application/atom_xml;
    open_file_cache max=100000 inactive=20s;
    client_max_body_size 5000m;

    include odoo_upstream.conf;

    # 默认主 localhost，按映射处理
    server {
        listen       80 default;
	      proxy_cache off;

        ## 跨域设置
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Credentials true;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, DELETE';
        add_header X-Frame-Options ALLOWALL;
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        if ($request_method = 'OPTIONS') {
            return 204;
        }
        ## end 跨域设置

        location /h5/ {
          root   D:\\PjWeb\\o16.erpapp.cn\\myconf\\usr\\local\\nginx\\html;
          index   index.html;
		      default_type text/html;
        }

        location /documentation/ {
          root   D:\\PjWeb\\odoc\\build;
          index   index.html;
		      default_type text/html;
        }

        location /{
            proxy_pass http://$oserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_header Set-Cookie;
            proxy_connect_timeout      600;
            proxy_send_timeout         600;
            proxy_read_timeout         3000;
        }
        location /websocket{
            proxy_pass http://$lserver;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass_header Set-Cookie;
            proxy_connect_timeout      60;
            proxy_send_timeout         60;
            proxy_read_timeout         3000;
        }
    }
}
